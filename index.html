<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mari ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
color:white;
text-align:center;
overflow-x:hidden;
}

#entrada{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

button{
padding:15px 25px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

.card{
background:rgba(255,255,255,0.15);
padding:20px;
margin:20px;
border-radius:20px;
backdrop-filter:blur(10px);
}

img{
width:250px;
border-radius:15px;
margin:10px;
}

#conteudo{
display:none;
padding:20px;
}

.heart{
position:fixed;
top:-10px;
color:red;
animation:fall linear forwards;
font-size:20px;
}

@keyframes fall{
to{transform:translateY(110vh);}
}

iframe{
border-radius:15px;
}
</style>
</head>

<body>

<!-- ENTRADA -->
<div id="entrada">
<h1>❤️ Para Mari ❤️</h1>
<p>Um presente especial pra você...</p>
<button onclick="entrar()">Entrar 💖</button>
</div>

<!-- CONTEUDO -->
<div id="conteudo">

<h1>💖 Nosso cantinho 💖</h1>

<!-- MUSICA -->
<div class="card">
<h2>🎵 Nossa música</h2>

<button onclick="window.open('https://www.youtube.com/watch?v=rtOvBOTyX00','_blank')">
Ouvir nossa música ❤️
</button>

</div>
<!-- CONTADOR -->
<div class="card">
<h2>⏳ Nosso tempo juntos</h2>
<p id="contador"></p>
</div>

<!-- CARTA -->
<div class="card">
<h2>💌 Carta</h2>
<p>
Mari, você é a melhor parte dos meus dias.<br>
Mesmo longe, você sempre está comigo.<br><br>
Eu te amo ❤️
</p>
</div>

<!-- FOTOS -->
<div class="card">
<h2>📸 Nossas fotos</h2>
<img src="img_1.jpeg">
<img src="img_2.jpeg">
<img src="img_3.jpeg">
<img src="IMG_7011.jpeg">
<img src="IMG_6236.jpeg">
</div>

</div>

<script>

// DATA DO NAMORO
let inicio = new Date("2025-09-17T19:00:00");

function atualizar(){

let agora = new Date();
let diff = agora - inicio;

let anos = agora.getFullYear() - inicio.getFullYear();
let meses = agora.getMonth() - inicio.getMonth();
let dias = agora.getDate() - inicio.getDate();

if(dias < 0){
meses--;
dias += 30;
}

if(meses < 0){
anos--;
meses += 12;
}

let horas = Math.floor(diff / (1000*60*60)) % 24;
let minutos = Math.floor(diff / (1000*60)) % 60;
let segundos = Math.floor(diff / 1000) % 60;

document.getElementById("contador").innerHTML = `
💖 ${anos} anos, ${meses} meses e ${dias} dias 💖<br>
⏰ ${horas}h ${minutos}m ${segundos}s juntos
`;
}

atualizar();
setInterval(atualizar, 1000);

// ENTRAR
function entrar(){
document.getElementById("entrada").style.display="none";
document.getElementById("conteudo").style.display="block";
}

// CORAÇÕES
function criar(){
let heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),5000);
}
setInterval(criar,300);

</script>

</body>
</html>
